<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Schedule Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-color: #0f172a;
        --panel-bg: rgba(30, 41, 59, 0.7);
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --border-color: rgba(148, 163, 184, 0.2);
        
        /* Syntax Highlight Colors */
        --color-linux: #4ade80; 
        --color-work: #38bdf8;  
        --color-cook: #fbbf24;  
        --color-chill: #c084fc; 
        
        /* Grid Alignment Variables */
        --slot-height: 65px;
        --grid-gap: 12px;
    }

    body { 
        font-family: 'Inter', sans-serif; 
        background-color: var(--bg-color);
        background-image: 
            linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 30px 30px;
        color: var(--text-main); 
        margin: 0; 
        padding: 40px; 
        min-height: 100vh;
    }

    .header-section {
        max-width: 1400px;
        margin: 0 auto 30px auto;
        animation: fadeInDown 0.6s ease forwards;
    }

    .terminal-prompt {
        font-family: 'Fira Code', monospace;
        font-size: 24px;
        font-weight: 600;
        margin: 0 0 8px 0;
        color: var(--color-linux);
        text-shadow: 0 0 10px rgba(74, 222, 128, 0.3);
    }
    
    .terminal-prompt span { color: var(--text-main); }
    .title p { font-family: 'Fira Code', monospace; font-size: 13px; color: var(--text-muted); margin: 0 0 24px 0; }

    .settings-panel {
        display: flex; align-items: center; background: var(--panel-bg);
        border: 1px solid var(--border-color); border-radius: 8px;
        padding: 12px 20px; gap: 20px; margin-bottom: 20px;
        font-family: 'Fira Code', monospace; font-size: 13px; color: var(--text-muted);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .settings-panel input {
        background: #0f172a; border: 1px solid var(--border-color);
        color: var(--color-linux); padding: 6px 10px; border-radius: 4px;
        width: 50px; font-family: 'Fira Code', monospace;
    }

    .settings-panel input:focus { outline: none; border-color: var(--color-linux); }

    .settings-panel button {
        background: rgba(74, 222, 128, 0.1); border: 1px solid var(--color-linux);
        color: var(--color-linux); padding: 6px 16px; border-radius: 4px; cursor: pointer;
        font-family: 'Fira Code', monospace; transition: all 0.2s;
    }

    .settings-panel button:hover { background: var(--color-linux); color: #000; box-shadow: 0 0 15px rgba(74, 222, 128, 0.4); }

    .filter-bar {
        display: flex; align-items: center; background: var(--panel-bg);
        backdrop-filter: blur(12px); border: 1px solid var(--border-color);
        border-radius: 8px; padding: 12px 20px; gap: 16px; flex-wrap: wrap;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .filter-label {
        font-size: 13px; font-weight: 600; color: var(--text-muted);
        text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; margin-right: auto;
    }

    .controls { display: flex; gap: 10px; flex-wrap: wrap; }

    .controls button {
        background-color: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 6px; padding: 8px 16px; cursor: pointer; font-size: 13px;
        font-weight: 600; color: var(--text-muted); transition: all 0.3s ease; font-family: 'Fira Code', monospace;
    }

    .controls button:hover { background-color: rgba(255, 255, 255, 0.1); color: var(--text-main); transform: translateY(-2px); }
    .controls .active { background-color: rgba(255, 255, 255, 0.15) !important; color: var(--text-main) !important; border-color: rgba(255, 255, 255, 0.3) !important; }
    .clear-btn { background: transparent !important; border: none !important; }

    .calendar-container { overflow-x: auto; padding-bottom: 20px; }

    .calendar-grid {
        display: grid; grid-template-columns: repeat(7, minmax(180px, 1fr));
        gap: 16px; min-width: 1200px; max-width: 1400px; margin: 0 auto;
    }

    .day-column {
        display: flex; flex-direction: column; gap: var(--grid-gap);
        background: var(--panel-bg); backdrop-filter: blur(10px);
        border: 1px solid var(--border-color); border-radius: 12px; padding: 16px;
        opacity: 0; animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .day-column:nth-child(1) { animation-delay: 0.1s; }
    .day-column:nth-child(2) { animation-delay: 0.2s; }
    .day-column:nth-child(3) { animation-delay: 0.3s; }
    .day-column:nth-child(4) { animation-delay: 0.4s; }
    .day-column:nth-child(5) { animation-delay: 0.5s; }
    .day-column:nth-child(6) { animation-delay: 0.6s; }
    .day-column:nth-child(7) { animation-delay: 0.7s; }

    .day-name {
        font-family: 'Fira Code', monospace; font-weight: 600; font-size: 14px;
        color: var(--text-main); text-transform: uppercase; padding-bottom: 12px;
        border-bottom: 1px solid var(--border-color); margin-bottom: 4px; text-align: center;
    }

    .event {
        box-sizing: border-box; height: var(--slot-height); padding: 12px 14px;
        border-radius: 6px; font-size: 13px; transition: all 0.3s ease;
        position: relative; cursor: pointer; background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.05); z-index: 1; overflow: hidden;
    }
    
    .event:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 10px 20px rgba(0,0,0,0.3); z-index: 10; }

    .empty-slot { background: transparent; border: 1px dashed var(--border-color); opacity: 0.6; }
    .empty-slot:hover { border-color: var(--color-linux); opacity: 1; background: rgba(74, 222, 128, 0.05); transform: translateY(-2px); }
    .empty-slot .event-title { color: var(--text-muted); font-family: 'Fira Code', monospace; font-size: 11px; }

    .event-time { font-family: 'Fira Code', monospace; display: block; font-size: 11px; margin-bottom: 4px; opacity: 0.7; }
    .event-title { font-weight: 600; line-height: 1.4; padding-right: 15px; display: block; }
    .note-icon { position: absolute; top: 10px; right: 10px; font-size: 12px; opacity: 0.8; color: var(--color-linux); font-family: 'Fira Code', monospace; }
    
    .cat-work { border-left: 4px solid var(--color-work); color: #bae6fd; }
    .cat-cook { border-left: 4px solid var(--color-cook); color: #fde68a; }
    .cat-chill { border-left: 4px solid var(--color-chill); color: #e9d5ff; }
    .cat-study { border-left: 4px solid var(--color-linux); color: #bbf7d0; background: rgba(74, 222, 128, 0.05); }

    .dimmed { opacity: 0.15; transform: scale(0.95); pointer-events: none; filter: grayscale(100%); }
    .event.completed { background: rgba(15, 23, 42, 0.3) !important; border-left-color: #475569 !important; color: #64748b !important; opacity: 0.5; }
    .event.completed .event-title::before { content: "// "; color: #475569; }
    .event.completed .event-title, .event.completed .event-time { text-decoration: line-through; }

    .modal-overlay {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(2, 6, 23, 0.8); backdrop-filter: blur(8px); z-index: 100;
        justify-content: center; align-items: center; animation: fadeIn 0.3s ease forwards;
    }

    .modal {
        background: #1e293b; padding: 30px; border-radius: 12px;
        box-shadow: 0 24px 48px rgba(0,0,0,0.5), 0 0 0 1px var(--border-color);
        text-align: left; max-width: 400px; width: 100%;
        animation: popInSpring 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .modal h3 { margin: 0 0 6px 0; font-weight: 700; color: var(--text-main); font-size: 18px; font-family: 'Fira Code', monospace; }
    .modal h3::before { content: "> "; color: var(--color-linux); }
    .modal p { margin: 0 0 20px 0; color: var(--text-muted); font-size: 13px; font-family: 'Fira Code', monospace; }

    .input-row { display: flex; gap: 10px; margin-bottom: 15px; }
    
    .modal input[type="text"], .modal select {
        width: 100%; padding: 12px; border-radius: 6px; border: 1px solid var(--border-color);
        background: #0f172a; color: var(--text-main); font-family: 'Inter', sans-serif;
        box-sizing: border-box; transition: border-color 0.2s;
    }

    .modal textarea {
        width: 100%; height: 100px; padding: 16px; border-radius: 8px;
        border: 1px solid var(--border-color); background: #0f172a; font-family: 'Fira Code', monospace;
        font-size: 13px; color: var(--color-linux); resize: none; box-sizing: border-box; margin-bottom: 20px;
    }

    .modal input:focus, .modal select:focus, .modal textarea:focus { outline: none; border-color: var(--color-linux); box-shadow: 0 0 0 2px rgba(74, 222, 128, 0.2); }

    .modal-buttons { display: flex; flex-direction: column; gap: 10px; }
    .modal-buttons button {
        padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;
        font-size: 13px; transition: all 0.2s; font-family: 'Fira Code', monospace;
        display: flex; justify-content: center; align-items: center; gap: 8px;
    }

    .btn-complete { background: rgba(74, 222, 128, 0.1); color: var(--color-linux); border: 1px solid var(--color-linux); }
    .btn-complete:hover { background: var(--color-linux); color: #000; transform: scale(1.02); }
    .btn-incomplete { background: rgba(255, 255, 255, 0.05); color: var(--text-main); border: 1px solid var(--border-color); }
    .btn-incomplete:hover { background: rgba(255, 255, 255, 0.1); transform: scale(1.02); }
    .btn-delete { background: rgba(239, 68, 68, 0.05); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
    .btn-delete:hover { background: #ef4444; color: #fff; transform: scale(1.02); }
    .btn-cancel { background: transparent; color: var(--text-muted); }
    .btn-cancel:hover { color: var(--text-main); }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideUpFade { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes popInSpring { from { opacity: 0; transform: scale(0.8) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }

</style>
</head>
<body>

<div class="header-section">
    <div class="title">
        <h1 class="terminal-prompt">Weekly Schedule Planner</h1>
        <p>Dynamic App Mode - Data stays local to browser</p>
    </div>
    
    <div class="settings-panel">
        <span>[Set_Parameters]</span>
        <label>Start Hour: <input type="number" id="config-start" min="0" max="23" value="8"></label>
        <label>End Hour: <input type="number" id="config-end" min="0" max="23" value="22"></label>
        <button onclick="updateConfig()">Rebuild_Grid</button>
    </div>

    <div class="filter-bar">
        <div class="filter-label">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-linux)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
            Filter_By_Tag
        </div>
        <div class="controls" id="filters">
            <button class="btn-work" onclick="filterEvents('cat-work', this)">Work</button>
            <button class="btn-study" onclick="filterEvents('cat-study', this)">Study/Linux</button>
            <button class="btn-cook" onclick="filterEvents('cat-cook', this)">Cooking/Prep</button>
            <button class="btn-chill" onclick="filterEvents('cat-chill', this)">Chilling</button>
            <button class="clear-btn active" onclick="filterEvents('all', this)">[Clear_Filters]</button>
        </div>
    </div>
</div>

<div class="calendar-container">
    <div class="calendar-grid" id="calendar-grid"></div>
</div>

<div class="modal-overlay" id="taskModal">
    <div class="modal">
        <h3>Configure_Node</h3>
        <p id="modalTaskTime"></p>
        
        <input type="text" id="modalTaskTitle" placeholder="Task Name (e.g. Server Maintenance)" style="margin-bottom: 15px;">
        
        <div class="input-row">
            <select id="modalCategory" style="flex: 1; margin-bottom: 0;">
                <option value="cat-work">Work</option>
                <option value="cat-study">Study / Linux</option>
                <option value="cat-cook">Cooking / Prep</option>
                <option value="cat-chill">Chilling / Leisure</option>
            </select>
            
            <select id="modalEndTime" style="flex: 1; margin-bottom: 0;">
                </select>
        </div>

        <textarea id="modalNotes" placeholder="// Add bash cmds, links, or notes here...&#10;sudo apt update"></textarea>
        
        <div class="modal-buttons">
            <button class="btn-incomplete" onclick="saveTask(false)">Save & Mark_Pending</button>
            <button class="btn-complete" onclick="saveTask(true)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                Execute & Mark_Complete
            </button>
            <button class="btn-delete" onclick="deleteTask()">[Delete_Task]</button>
            <button class="btn-cancel" onclick="closeModal()">[Abort]</button>
        </div>
    </div>
</div>

<script>
    const daysOfWeek = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
    let currentSelectedId = null;
    let currentStartHour = null;

    let config = JSON.parse(localStorage.getItem('plannerAppConfig')) || { start: 8, end: 22 };
    document.getElementById('config-start').value = config.start;
    document.getElementById('config-end').value = config.end;

    function updateConfig() {
        const start = parseInt(document.getElementById('config-start').value);
        const end = parseInt(document.getElementById('config-end').value);
        if (start >= end) {
            alert("Error: Start hour must be before end hour.");
            return;
        }
        config.start = start;
        config.end = end;
        localStorage.setItem('plannerAppConfig', JSON.stringify(config));
        
        const grid = document.getElementById('calendar-grid');
        grid.innerHTML = '';
        setTimeout(renderGrid, 10);
    }

    function formatTime(hour) {
        let ampm = hour >= 12 && hour < 24 ? 'PM' : 'AM';
        let displayHour = hour % 12 || 12;
        return `${displayHour}:00 ${ampm}`;
    }

    function renderGrid() {
        const grid = document.getElementById('calendar-grid');
        grid.innerHTML = '';
        
        let allTasks = JSON.parse(localStorage.getItem('plannerAppTasks')) || {};

        daysOfWeek.forEach(day => {
            let columnHtml = `<div class="day-column"><div class="day-name">${day}</div>`;
            
            let skipUntil = -1; 
            
            for (let h = config.start; h <= config.end; h++) {
                if (h < skipUntil) continue; 

                const blockId = `${day}-${h}`;
                const timeStr = formatTime(h);
                const task = allTasks[blockId];

                if (task) {
                    let duration = parseInt(task.duration) || 1;
                    let maxAllowed = config.end - h + 1;
                    duration = Math.min(duration, maxAllowed);
                    
                    skipUntil = h + duration; 

                    let completedClass = task.completed ? 'completed' : '';
                    let noteIcon = (task.notes && task.notes.trim() !== '') ? '<span class="note-icon">/></span>' : '';
                    
                    let endTimeStr = formatTime(h + duration);
                    let displayTime = duration > 1 ? `${timeStr} - ${endTimeStr}` : timeStr;

                    let inlineStyle = `height: calc(${duration} * var(--slot-height) + ${duration - 1} * var(--grid-gap));`;

                    columnHtml += `
                        <div class="event ${task.category} ${completedClass}" style="${inlineStyle}" data-id="${blockId}" onclick="openModal('${blockId}', '${day}', '${timeStr}', ${h})">
                            <span class="event-time">${displayTime}</span>
                            <span class="event-title">${task.title}</span>
                            ${noteIcon}
                        </div>
                    `;
                } else {
                    columnHtml += `
                        <div class="event empty-slot" data-id="${blockId}" onclick="openModal('${blockId}', '${day}', '${timeStr}', ${h})">
                            <span class="event-time">${timeStr}</span>
                            <span class="event-title">+ add_task</span>
                        </div>
                    `;
                }
            }
            columnHtml += `</div>`;
            grid.innerHTML += columnHtml;
        });

        document.querySelector('.clear-btn').click();
    }

    function openModal(blockId, dayStr, timeStr, startHour) {
        currentSelectedId = blockId;
        currentStartHour = startHour; 

        document.getElementById('modalTaskTime').innerText = `Target: ${dayStr} @ ${timeStr}`;
        
        let allTasks = JSON.parse(localStorage.getItem('plannerAppTasks')) || {};
        let taskData = allTasks[blockId] || { title: '', category: 'cat-work', notes: '', completed: false, duration: 1 };
        
        document.getElementById('modalTaskTitle').value = taskData.title;
        document.getElementById('modalCategory').value = taskData.category;
        
        const endSelect = document.getElementById('modalEndTime');
        endSelect.innerHTML = '';
        
        for (let i = startHour + 1; i <= config.end + 1; i++) {
            let label = i === 24 ? "12:00 AM (Midnight)" : formatTime(i);
            
            let isSelected = false;
            if (taskData.duration && i === startHour + taskData.duration) isSelected = true;
            if (!taskData.duration && i === startHour + 1) isSelected = true; 
            
            endSelect.innerHTML += `<option value="${i}" ${isSelected ? 'selected' : ''}>Ends at ${label}</option>`;
        }

        document.getElementById('modalNotes').value = taskData.notes || '';
        document.getElementById('taskModal').style.display = 'flex';
    }

    function saveTask(isComplete) {
        if (!currentSelectedId) return;
        
        const title = document.getElementById('modalTaskTitle').value;
        if (title.trim() === '') {
            alert("Task Name is required.");
            return;
        }

        const category = document.getElementById('modalCategory').value;
        const notes = document.getElementById('modalNotes').value;
        
        let endHour = parseInt(document.getElementById('modalEndTime').value);
        let duration = endHour - currentStartHour;
        if (isNaN(duration) || duration < 1) duration = 1;
        
        let allTasks = JSON.parse(localStorage.getItem('plannerAppTasks')) || {};
        
        allTasks[currentSelectedId] = {
            title: title,
            category: category,
            notes: notes,
            duration: duration,
            completed: isComplete
        };
        
        localStorage.setItem('plannerAppTasks', JSON.stringify(allTasks));
        closeModal();
        renderGrid(); 
    }

    function deleteTask() {
        if (!currentSelectedId) return;
        let allTasks = JSON.parse(localStorage.getItem('plannerAppTasks')) || {};
        delete allTasks[currentSelectedId];
        localStorage.setItem('plannerAppTasks', JSON.stringify(allTasks));
        closeModal();
        renderGrid();
    }

    function closeModal() {
        document.getElementById('taskModal').style.display = 'none';
        currentSelectedId = null;
    }

    function filterEvents(categoryClass, btnElement) {
        const buttons = document.querySelectorAll('.controls button');
        buttons.forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');

        const filledEvents = document.querySelectorAll('.event:not(.empty-slot)');
        
        filledEvents.forEach(event => {
            if (categoryClass === 'all') {
                event.classList.remove('dimmed');
            } else {
                if (event.classList.contains(categoryClass)) {
                    event.classList.remove('dimmed');
                } else {
                    event.classList.add('dimmed');
                }
            }
        });
    }

    document.addEventListener('DOMContentLoaded', renderGrid);

</script>
</body>
</html>
