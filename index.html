<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Schedule Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    /* =========================================
       CORE STYLES & VARIABLES
       ========================================= */
    :root {
        --bg-color: #0f172a; --panel-bg: rgba(30, 41, 59, 0.7); --text-main: #f8fafc;
        --text-muted: #94a3b8; --border-color: rgba(148, 163, 184, 0.2); --color-accent: #4ade80;
    }

    body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px); background-size: 30px 30px; color: var(--text-main); margin: 0; padding: 40px; min-height: 100vh; overflow-x: hidden; transition: background-color 0.5s; }
    
    .mouse-glow { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: -1; background: radial-gradient(400px circle at var(--mouse-x, 50vw) var(--mouse-y, 50vh), rgba(74, 222, 128, 0.08), transparent 40%); }

    /* =========================================
       UI COMPONENTS
       ========================================= */
    .header-section { max-width: 1400px; margin: 0 auto 30px auto; animation: fadeInDown 0.6s ease forwards; }
    .title-row { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; }
    
    /* 🎨 OG Title Styling Restored */
    .title h1 { font-family: 'Fira Code', monospace; font-size: 28px; font-weight: 600; margin: 0 0 8px 0; color: var(--color-accent); text-shadow: 0 0 15px rgba(74, 222, 128, 0.25); letter-spacing: 0.5px; }
    .title p { color: var(--text-muted); font-family: 'Fira Code', monospace; font-size: 13px; margin: 0;}
    
    .week-toggle-btn { background: rgba(15, 23, 42, 0.8); border: 1px solid var(--color-accent); color: var(--color-accent); padding: 10px 24px; border-radius: 8px; cursor: pointer; font-family: 'Fira Code', monospace; font-weight: 600; font-size: 14px; transition: all 0.2s; box-shadow: 0 0 15px rgba(74, 222, 128, 0.1); }
    .week-toggle-btn:hover { background: var(--color-accent); color: #000; box-shadow: 0 0 20px rgba(74, 222, 128, 0.3); transform: translateY(-2px); }

    .controls-top { display: flex; gap: 10px; margin-bottom: 20px;}
    .btn-secondary { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; transition: all 0.2s; display: flex; align-items: center; gap: 6px; }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255,255,255,0.3); }
    .btn-danger { color: #f87171; border-color: rgba(248, 113, 113, 0.3); }
    .btn-danger:hover { background: rgba(248, 113, 113, 0.1); border-color: #f87171; }
    .btn-focus.active { background: var(--color-accent); color: #000; border-color: var(--color-accent); }

    /* =========================================
       PREMIUM INSIGHTS DASHBOARD
       ========================================= */
    .insights-wrapper { margin-bottom: 20px; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px 24px 24px 24px; backdrop-filter: blur(12px); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2); }
    .insights-header { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    
    .insights-bar { display: flex; height: 12px; border-radius: 6px; background: rgba(15, 23, 42, 0.8); position: relative; }
    .insight-segment { height: 100%; width: 0%; transition: width 1s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.2s, filter 0.2s; position: relative; cursor: crosshair; }
    .insight-segment:first-child { border-top-left-radius: 6px; border-bottom-left-radius: 6px; }
    .insight-segment:last-child { border-top-right-radius: 6px; border-bottom-right-radius: 6px; }
    .insight-segment:hover { transform: scaleY(1.4); filter: brightness(1.2); z-index: 10; }
    
    .insight-segment::after {
        content: attr(data-label); position: absolute; bottom: calc(100% + 10px); left: 50%;
        transform: translateX(-50%) translateY(10px); background: #1e293b; color: #f8fafc;
        padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 700;
        font-family: 'Fira Code', monospace; opacity: 0; pointer-events: none;
        transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        border: 1px solid var(--border-color); box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        white-space: nowrap; z-index: 20;
    }
    .insight-segment:hover::after { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* =========================================
       FILTER BAR
       ========================================= */
    .filter-bar { display: flex; align-items: center; background: var(--panel-bg); backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px 24px; gap: 20px; flex-wrap: wrap; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2); }
    .filter-label { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-right: auto; }
    .controls { display: flex; gap: 12px; flex-wrap: wrap; }
    .controls button { background-color: transparent; border: 1px solid var(--border-color); border-radius: 6px; padding: 8px 16px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text-muted); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); font-family: 'Fira Code', monospace; }
    .controls button:hover { background-color: rgba(255, 255, 255, 0.05); color: var(--text-main); transform: translateY(-1px); }
    .controls .active { background-color: rgba(255, 255, 255, 0.15) !important; color: var(--text-main) !important; border-color: rgba(255, 255, 255, 0.3) !important; box-shadow: 0 0 10px rgba(255,255,255,0.05); }
    .action-btn { border-style: dashed !important; color: var(--text-main) !important; border-color: rgba(255,255,255,0.3) !important; }

    /* =========================================
       GRID & TASKS
       ========================================= */
    .calendar-container { padding-bottom: 20px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(160px, 1fr)); gap: 16px; max-width: 1400px; margin: 0 auto; transition: opacity 0.25s ease; }
    
    .day-column { display: flex; flex-direction: column; gap: 12px; background: var(--panel-bg); backdrop-filter: blur(10px); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; transition: filter 0.4s ease; min-height: 200px; opacity: 0; animation: columnStaggerEnter 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    .day-name { font-family: 'Fira Code', monospace; font-weight: 600; font-size: 14px; color: var(--text-main); text-transform: uppercase; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); margin-bottom: 4px; letter-spacing: 1px; }

    body.focus-active .day-column:not(.is-today) { opacity: 0.3 !important; filter: grayscale(100%); pointer-events: none; }
    body.focus-active .day-column.is-today { box-shadow: 0 0 30px rgba(74, 222, 128, 0.1); border-color: rgba(74, 222, 128, 0.3); }

    .event { padding: 14px; border-radius: 8px; font-size: 13px; transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); position: relative; cursor: pointer; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.05); }
    .event:hover { transform: translateX(4px) scale(1.02); box-shadow: -4px 4px 15px rgba(0,0,0,0.3); z-index: 10; }
    .event[draggable="true"]:active { cursor: grabbing; opacity: 0.7; transform: scale(0.95); }
    .day-column.drag-over { background: rgba(74, 222, 128, 0.05); border-color: var(--color-accent); }

    .event-time { font-family: 'Fira Code', monospace; display: block; font-size: 11px; font-weight: 400; margin-bottom: 8px; opacity: 0.7; pointer-events: none; }
    .event-title { font-weight: 600; line-height: 1.4; padding-right: 15px; display: inline-block; pointer-events: none; }
    .note-indicator { position: absolute; top: 12px; right: 12px; width: 6px; height: 6px; border-radius: 50%; }

    .add-task-btn { background: transparent; border: 1px dashed rgba(148, 163, 184, 0.3); color: var(--text-muted); padding: 12px; border-radius: 8px; text-align: center; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); margin-top: auto; }
    .add-task-btn:hover { border-color: var(--color-accent); color: var(--color-accent); background: rgba(74, 222, 128, 0.05); transform: translateY(-2px); }

    /* Task States & New Animation */
    .dimmed { opacity: 0.15; transform: scale(0.98); pointer-events: none; filter: grayscale(100%); }
    .event.completed { background: rgba(15, 23, 42, 0.3) !important; border-left-color: #475569 !important; opacity: 0.5; color: #64748b !important; box-shadow: none !important; }
    .event.completed .event-title::before { content: "// "; color: #475569; font-family: 'Fira Code', monospace; }
    .event.completed .event-title, .event.completed .event-time { text-decoration: line-through; }
    
    /* ✨ New Pulse Animation on Completion */
    .event.just-completed { animation: taskCompletePulse 0.4s ease-out forwards; }

    @keyframes liquidBleed { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    .liquid-warning { background: linear-gradient(135deg, rgba(127, 29, 29, 0.8), rgba(239, 68, 68, 0.8), rgba(153, 27, 27, 0.8)) !important; background-size: 200% 200% !important; animation: liquidBleed 3s ease infinite !important; border: 1px solid #f87171 !important; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4) !important; }
    .liquid-warning .event-title, .liquid-warning .event-time { color: #fff !important; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

    /* =========================================
       MODALS & CONTEXT MENU
       ========================================= */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(8px); z-index: 100; justify-content: center; align-items: center; animation: fadeIn 0.2s ease forwards; }
    .modal { background: #1e293b; padding: 32px; border-radius: 16px; box-shadow: 0 24px 48px rgba(0,0,0,0.6), 0 0 0 1px var(--border-color); text-align: left; max-width: 420px; width: 100%; animation: popInSpring 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    .modal h3 { font-family: 'Fira Code', monospace; margin: 0 0 16px 0; font-weight: 700; color: var(--text-main); font-size: 20px; }
    .modal h3::before { content: "> "; color: var(--color-accent); }
    
    .context-menu { position: absolute; display: none; background: #1e293b; border: 1px solid var(--border-color); border-radius: 8px; padding: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 1000; animation: popInSpring 0.2s forwards; }
    .context-menu button { display: block; width: 100%; text-align: left; background: none; border: none; padding: 10px 16px; color: var(--text-main); cursor: pointer; border-radius: 4px; font-family: 'Inter', sans-serif; font-size: 13px; transition: background 0.2s; }
    .context-menu button:hover { background: rgba(255,255,255,0.05); }
    .context-menu .ctx-danger:hover { background: rgba(239, 68, 68, 0.1); color: #f87171; }

    .input-row { display: flex; gap: 12px; margin-bottom: 16px; }
    .modal input[type="text"], .modal select, .modal textarea { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid var(--border-color); background: #0f172a; color: var(--text-main); font-family: 'Inter', sans-serif; font-size: 14px; box-sizing: border-box; transition: all 0.2s ease; }
    .modal input[type="text"] { margin-bottom: 16px; font-weight: 500; }
    .modal textarea { height: 100px; resize: none; margin-bottom: 24px; font-family: 'Fira Code', monospace; font-size: 12px; }
    .modal input:focus, .modal select:focus, .modal textarea:focus { outline: none; border-color: var(--color-accent); box-shadow: 0 0 0 2px rgba(74, 222, 128, 0.2); }

    .modal-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
    .modal-btn { padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; transition: all 0.2s; font-family: 'Fira Code', monospace; }
    .btn-complete { background: rgba(74, 222, 128, 0.1); color: var(--color-accent); border: 1px solid var(--color-accent); }
    .btn-complete:hover { background: var(--color-accent); color: #000; }
    .btn-save { background: rgba(255, 255, 255, 0.05); color: var(--text-main); border: 1px solid var(--border-color); }
    .btn-save:hover { background: rgba(255, 255, 255, 0.1); }
    .btn-modal-danger { background: transparent; color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
    .btn-modal-danger:hover { background: #ef4444; color: #fff; }
    .btn-cancel { background: transparent; color: var(--text-muted); }
    .btn-cancel:hover { color: var(--text-main); }

    /* Animations */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes popInSpring { from { opacity: 0; transform: scale(0.9) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
    @keyframes columnStaggerEnter { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes taskCompletePulse { 0% { transform: scale(1); filter: brightness(1); box-shadow: 0 0 0 transparent; } 50% { transform: scale(0.95); filter: brightness(1.5); box-shadow: 0 0 20px rgba(74,222,128,0.5); } 100% { transform: scale(1); filter: brightness(1); box-shadow: 0 0 0 transparent; } }
    
    .error-shake { animation: shake 0.3s ease; border-color: #ef4444 !important; }
</style>
<style id="dynamic-tag-styles"></style>
</head>
<body>

<div class="mouse-glow"></div>

<div class="header-section">
    <div class="title-row">
        <div class="title">
            <h1>Weekly Schedule</h1>
            <p id="week-indicator">Execution timeframe: Loading...</p>
        </div>
        <button class="week-toggle-btn" onclick="toggleWeek()" id="week-btn">Switch to Week 2</button>
    </div>
    
    <div class="controls-top">
        <button class="btn-secondary btn-focus" id="focusToggle" onclick="toggleFocusMode()">🎯 Focus Today</button>
        <button class="btn-secondary" onclick="exportData()">💾 Backup</button>
        <label class="btn-secondary">📂 Import<input type="file" accept=".json" style="display:none;" onchange="importData(event)"></label>
        <button class="btn-secondary btn-danger" onclick="nukeSchedule()">🗑️ Clear</button>
    </div>
    
    <div class="insights-wrapper">
        <div class="insights-header"><span>Time Distribution</span><span id="total-hours">0 Hours (Week 1)</span></div>
        <div class="insights-bar" id="insights-bar-container"></div>
    </div>

    <div class="filter-bar">
        <div class="filter-label">> Filter_By_Tag</div>
        <div class="controls" id="filter-container"></div>
    </div>
</div>

<div class="calendar-container">
    <div class="calendar-grid" id="calendar-grid"></div>
</div>

<div class="context-menu" id="context-menu">
    <button onclick="ctxAction('complete')">Toggle Complete</button>
    <button onclick="ctxAction('incomplete')" style="color: #f87171;">Mark Incomplete</button>
    <button onclick="ctxAction('delete')" class="ctx-danger">Delete</button>
</div>

<div class="modal-overlay" id="taskModal">
    <div class="modal">
        <h3>Edit_Task</h3>
        <input type="text" id="modalTaskTitle" placeholder="Task Name">
        <div class="input-row">
            <select id="modalCategory"></select>
        </div>
        <div class="input-row">
            <select id="modalStartTime" style="flex:1;"></select>
            <select id="modalEndTime" style="flex:1;"></select>
        </div>
        <textarea id="modalNotes" placeholder="// Add notes, links, or commands..."></textarea>
        <div class="modal-buttons">
            <button class="modal-btn btn-complete" onclick="saveTask('complete')">Execute & Mark_Complete</button>
            <button class="modal-btn btn-save" onclick="saveTask('active')">Save Data</button>
            <button class="modal-btn btn-modal-danger" onclick="deleteTask()">[Delete]</button>
            <button class="modal-btn btn-cancel" onclick="closeModal('taskModal')">Abort</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="tagModal">
    <div class="modal">
        <h3>Config_Tags</h3>
        <div id="tag-edit-container"></div>
        <div class="modal-buttons" style="margin-top: 24px;">
            <button class="modal-btn btn-complete" onclick="saveTags()">Save Configuration</button>
            <button class="modal-btn btn-cancel" onclick="closeModal('tagModal')">Abort</button>
        </div>
    </div>
</div>

<script>
    document.addEventListener('mousemove', (e) => {
        document.documentElement.style.setProperty('--mouse-x', `${e.clientX}px`);
        document.documentElement.style.setProperty('--mouse-y', `${e.clientY}px`);
    });

    const daysOfWeek = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
    let currentWeek = 1;
    let currentSelectedId = null; let currentEditDay = null; let ctxSelectedId = null;
    let config = { start: 0, end: 23 };

    const defaultTags = {
        'cat-work': { name: 'Work', color: '#38bdf8' },
        'cat-study': { name: 'Study / Linux', color: '#4ade80' },
        'cat-cook': { name: 'Cooking / Prep', color: '#fbbf24' },
        'cat-chill': { name: 'Chilling', color: '#c084fc' }
    };
    let appTags = JSON.parse(localStorage.getItem('plannerAppTags')) || defaultTags;

    function migrateData() {
        let allTasks = JSON.parse(localStorage.getItem('plannerAppTasks')) || {};
        let migrated = false; const newTasks = {};
        for (let key in allTasks) {
            if (!key.startsWith('W1-') && !key.startsWith('W2-')) { newTasks['W1-' + key] = allTasks[key]; migrated = true; } 
            else { newTasks[key] = allTasks[key]; }
        }
        if (migrated) localStorage.setItem('plannerAppTasks', JSON.stringify(newTasks));
    }
    migrateData();

    function applyDynamicStylesAndUI() {
        let cssStr = ''; const filterContainer = document.getElementById('filter-container'); const modalSelect = document.getElementById('modalCategory');
        filterContainer.innerHTML = ''; modalSelect.innerHTML = '';

        for (const [id, tag] of Object.entries(appTags)) {
            cssStr += `
                .${id} { border-left: 4px solid ${tag.color}; }
                .${id}:hover { background: ${tag.color}15; }
            `;
            filterContainer.innerHTML += `<button class="filter-btn" data-cat="${id}" onclick="filterEvents('${id}', this)">${tag.name}</button>`;
            modalSelect.innerHTML += `<option value="${id}">${tag.name}</option>`;
        }
        filterContainer.innerHTML += `<button class="clear-btn active" data-cat="all" onclick="filterEvents('all', this)">[Clear_Filters]</button> <button class="action-btn" onclick="openTagManager()">⚙️ Config</button>`;
        document.getElementById('dynamic-tag-styles').innerHTML = cssStr;
    }
    applyDynamicStylesAndUI();

    // 🌱 NEW ORGANIC FEATURE: Dynamic Timeframe Calculator based on Canadian locale formatting
    function updateTimeframeIndicator() {
        const today = new Date();
        const day = today.getDay();
        const diffToMonday = today.getDate() - day + (day === 0 ? -6 : 1);
        
        let mondayDate = new Date(today.setDate(diffToMonday));
        
        if (currentWeek === 2) {
            mondayDate.setDate(mondayDate.getDate() + 7);
        }
        
        let sundayDate = new Date(mondayDate);
        sundayDate.setDate(sundayDate.getDate() + 6);
        
        const options = { month: 'short', day: 'numeric' };
        // Outputting dates organically to match OG string style
        document.getElementById('week-indicator').innerText = `Execution timeframe: ${mondayDate.toLocaleDateString('en-CA', options)} - ${sundayDate.toLocaleDateString('en-CA', options)}`;
    }

    function toggleWeek() {
        currentWeek = currentWeek === 1 ? 2 : 1;
        updateTimeframeIndicator();
        document.getElementById('week-btn').innerText = `Switch to Week ${currentWeek === 1 ? 2 : 1}`;
        smoothRefresh();
    }

    function smoothRefresh() {
        const grid = document.getElementById('calendar-grid');
        grid.style.opacity = '0';
        setTimeout(() => {
            try { renderGrid(); } catch(e) { console.error(e); } 
            finally { grid.style.opacity = '1'; }
        }, 200);
    }

    function formatTime(hour) {
        let ampm = hour >= 12 && hour < 24 ? 'PM' : 'AM'; 
        let displayHour = hour % 12 || 12; 
        return `${displayHour.toString().padStart(2, '0')}:00 ${ampm}`;
    }

    function updateInsights() {
        let allTasks = JSON.parse(localStorage.getItem('plannerAppTasks')) || {};
        let totals = {}; let grandTotal = 0;
        for (const id of Object.keys(appTags)) totals[id] = 0;
        
        for (const [key, task] of Object.entries(allTasks)) {
            if (key.startsWith(`W${currentWeek}-`) && totals[task.category] !== undefined) { 
                totals[task.category] += task.duration; 
                grandTotal += task.duration; 
            }
        }
        
        document.getElementById('total-hours').innerText = `${grandTotal} Hours (Week ${currentWeek})`;
        const barContainer = document.getElementById('insights-bar-container');
        if(barContainer) {
            barContainer.innerHTML = '';
            if (grandTotal === 0) return;
            for (const [id, tag] of Object.entries(appTags)) {
                if (totals[id] > 0) {
                    let percent = (totals[id] / grandTotal) * 100;
                    barContainer.innerHTML += `<div class="insight-segment" style="width: ${percent}%; background: ${tag.color};" data-label="${tag.name}: ${totals[id]}h"></div>`;
                }
            }
        }
    }

    function renderGrid() {
        const grid = document.getElementById('calendar-grid'); grid.innerHTML = '';
        let allTasks = JSON.parse(localStorage.getItem('plannerAppTasks')) || {};
        let todayIndex = new Date().getDay() - 1; if (todayIndex === -1) todayIndex = 6; 

        daysOfWeek.forEach((day, index) => {
            let isTodayClass = (currentWeek === 1 && index === todayIndex) ? 'is-today' : '';
            let col = document.createElement('div');
            col.className = `day-column ${isTodayClass}`;
            col.id = `col-${day}`;
            // ✨ Animation 1: Cascading Delay for columns
            col.style.animationDelay = `${index * 0.06}s`; 
            
            col.setAttribute('ondragover', 'allowDrop(event)');
            col.setAttribute('ondragleave', 'dragLeave(event)');
            col.setAttribute('ondrop', `drop(event, '${day}')`);
            col.innerHTML = `<div class="day-name">${day}</div>`;

            let dayTasks = [];
            for (let key in allTasks) {
                if (key.startsWith(`W${currentWeek}-${day}-`)) {
                    let startHour = parseInt(key.split('-')[2]);
                    dayTasks.push({ id: key, hour: startHour, data: allTasks[key] });
                }
            }
            dayTasks.sort((a, b) => a.hour - b.hour);

            dayTasks.forEach(taskObj => {
                let task = taskObj.data;
                let start = taskObj.hour;
                let end = start + task.duration;
                
                let completedClass = (task.status === 'complete' || task.completed) ? 'completed' : '';
                let liquidClass = (task.status === 'incomplete') ? 'liquid-warning' : '';
                let tagColor = appTags[task.category] ? appTags[task.category].color : 'var(--color-accent)';
                let noteIcon = (task.notes && task.notes.trim() !== '') ? `<div class="note-indicator" style="background:${tagColor}"></div>` : '';
                let timeString = `${formatTime(start)} - ${formatTime(end)}`;

                let card = document.createElement('div');
                card.id = `task-${taskObj.id}`;
                card.className = `event ${task.category} ${completedClass} ${liquidClass}`;
                card.setAttribute('draggable', 'true');
                card.setAttribute('ondragstart', `dragStart(event, '${taskObj.id}')`);
                card.setAttribute('oncontextmenu', `handleContextMenu(event, '${taskObj.id}')`);
                card.setAttribute('onclick', `openTaskModal('${taskObj.id}', '${day}', ${start})`);
                
                card.innerHTML = `<span class="event-time">${timeString}</span><span class="event-title">${task.title || 'Untitled'}</span>${noteIcon}`;
                col.appendChild(card);
            });

            let addBtn = document.createElement('div');
            addBtn.className = 'add-task-btn';
            addBtn.innerText = '+ Add Task';
            addBtn.onclick = () => openTaskModal(null, day, 8);
            col.appendChild(addBtn);
            grid.appendChild(col);
        });

        let activeBtn = document.querySelector('.controls button.active');
        if (activeBtn) filterEvents(activeBtn.getAttribute('data-cat'), activeBtn);

        updateInsights(); 
    }

    function filterEvents(cat, btn) {
        if(btn) { document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }
        document.querySelectorAll('.event:not(.add-task-btn)').forEach(ev => {
            if (cat === 'all' || ev.classList.contains(cat)) ev.classList.remove('dimmed');
            else ev.classList.add('dimmed');
        });
    }

    // Drag & Drop
    function dragStart(ev, sourceId) { ev.dataTransfer.setData("text/plain", sourceId); }
    function allowDrop(ev) { ev.preventDefault(); ev.currentTarget.classList.add('drag-over'); }
    function dragLeave(ev) { ev.currentTarget.classList.remove('drag-over'); }
    function drop(ev, targetDay) {
        ev.preventDefault(); ev.currentTarget.classList.remove('drag-over');
        const sourceId = ev.dataTransfer.getData("text/plain"); if(!sourceId) return;
        
        let allTasks = JSON.parse(localStorage.getItem('plannerAppTasks')) || {};
        let task = allTasks[sourceId]; if(!task) return;
        
        let startHour = parseInt(sourceId.split('-')[2]);
        let newId = `W${currentWeek}-${targetDay}-${startHour}`;
        while (allTasks[newId] && newId !== sourceId) { startHour++; newId = `W${currentWeek}-${targetDay}-${startHour}`; }
        
        if (newId !== sourceId) {
            allTasks[newId] = task; delete allTasks[sourceId];
            localStorage.setItem('plannerAppTasks', JSON.stringify(allTasks)); smoothRefresh();
        }
    }

    function openTaskModal(blockId, dayStr, defaultHour) {
        currentSelectedId = blockId; currentEditDay = dayStr;
        let allTasks = JSON.parse(localStorage.getItem('plannerAppTasks')) || {};
        let taskData = blockId && allTasks[blockId] ? allTasks[blockId] : { title: '', category: 'cat-work', notes: '', status: 'active', duration: 1 };
        let startHour = blockId ? parseInt(blockId.split('-')[2]) : defaultHour;
        
        const titleInput = document.getElementById('modalTaskTitle');
        titleInput.value = taskData.title; titleInput.classList.remove('error-shake');
        document.getElementById('modalCategory').value = taskData.category;
        
        const startSelect = document.getElementById('modalStartTime'); startSelect.innerHTML = '';
        const endSelect = document.getElementById('modalEndTime'); endSelect.innerHTML = '';
        
        for (let i = 0; i < 24; i++) {
            startSelect.innerHTML += `<option value="${i}" ${i === startHour ? 'selected' : ''}>Start: ${formatTime(i)}</option>`;
            let endVal = i + 1;
            endSelect.innerHTML += `<option value="${endVal}" ${endVal === startHour + taskData.duration ? 'selected' : ''}>End: ${formatTime(endVal)}</option>`;
        }

        document.getElementById('modalNotes').value = taskData.notes || '';
        document.getElementById('taskModal').style.display = 'flex';
    }

    function saveTask(newStatus) {
        const titleInput = document.getElementById('modalTaskTitle');
        if (titleInput.value.trim() === '') { titleInput.classList.remove('error-shake'); void titleInput.offsetWidth; titleInput.classList.add('error-shake'); return; }

        let allTasks = JSON.parse(localStorage.getItem('plannerAppTasks')) || {};
        let startHour = parseInt(document.getElementById('modalStartTime').value);
        let endHour = parseInt(document.getElementById('modalEndTime').value);
        let duration = Math.max(1, endHour - startHour);
        
        let newId = `W${currentWeek}-${currentEditDay}-${startHour}`;
        if (currentSelectedId !== newId && allTasks[newId]) {
            while (allTasks[newId]) { startHour++; newId = `W${currentWeek}-${currentEditDay}-${startHour}`; }
        }

        let existingTask = currentSelectedId ? allTasks[currentSelectedId] : {};
        let finalStatus = newStatus === 'active' && existingTask.status ? existingTask.status : newStatus;

        let newTaskData = { title: titleInput.value, category: document.getElementById('modalCategory').value, notes: document.getElementById('modalNotes').value, duration: duration, status: finalStatus, completed: finalStatus === 'complete' };

        if (currentSelectedId && currentSelectedId !== newId) delete allTasks[currentSelectedId];
        allTasks[newId] = newTaskData;
        
        localStorage.setItem('plannerAppTasks', JSON.stringify(allTasks));
        closeModal('taskModal'); smoothRefresh(); 
    }

    function deleteTask() {
        if (currentSelectedId) {
            let allTasks = JSON.parse(localStorage.getItem('plannerAppTasks')) || {};
            delete allTasks[currentSelectedId];
            localStorage.setItem('plannerAppTasks', JSON.stringify(allTasks));
        }
        closeModal('taskModal'); smoothRefresh();
    }

    function handleContextMenu(e, id) { e.preventDefault(); e.stopPropagation(); ctxSelectedId = id; const m = document.getElementById('context-menu'); m.style.display = 'block'; m.style.left = `${e.pageX}px`; m.style.top = `${e.pageY}px`; }
    document.addEventListener('click', () => { document.getElementById('context-menu').style.display = 'none'; });
    
    function ctxAction(action) {
        if(!ctxSelectedId) return; let allTasks = JSON.parse(localStorage.getItem('plannerAppTasks')) || {};
        let task = allTasks[ctxSelectedId]; if(!task) return;
        
        if (action === 'complete') {
            task.status = (task.status === 'complete') ? 'active' : 'complete';
            task.completed = (task.status === 'complete');
            allTasks[ctxSelectedId] = task;
            localStorage.setItem('plannerAppTasks', JSON.stringify(allTasks));
            
            // ✨ Animation 2 logic check
            if (task.completed) {
                let card = document.getElementById(`task-${ctxSelectedId}`);
                if (card) {
                    card.classList.add('just-completed');
                    setTimeout(() => smoothRefresh(), 400); // Wait for pulse animation to finish
                    return;
                }
            }
        }
        else if (action === 'incomplete') task.status = (task.status === 'incomplete') ? 'active' : 'incomplete';
        else if (action === 'delete') { delete allTasks[ctxSelectedId]; localStorage.setItem('plannerAppTasks', JSON.stringify(allTasks)); smoothRefresh(); return; }
        
        task.completed = (task.status === 'complete');
        allTasks[ctxSelectedId] = task; localStorage.setItem('plannerAppTasks', JSON.stringify(allTasks)); smoothRefresh();
    }

    function toggleFocusMode() { document.body.classList.toggle('focus-active'); document.getElementById('focusToggle').classList.toggle('active'); }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; currentSelectedId = null; }
    
    function openTagManager() {
        const c = document.getElementById('tag-edit-container'); c.innerHTML = '';
        for (const [id, t] of Object.entries(appTags)) c.innerHTML += `<div class="tag-edit-row"><input type="color" id="color-${id}" value="${t.color}"><input type="text" id="name-${id}" value="${t.name}"></div>`;
        document.getElementById('tagModal').style.display = 'flex';
    }
    function saveTags() {
        for (const id of Object.keys(appTags)) { appTags[id].name = document.getElementById(`name-${id}`).value; appTags[id].color = document.getElementById(`color-${id}`).value; }
        localStorage.setItem('plannerAppTags', JSON.stringify(appTags)); applyDynamicStylesAndUI(); closeModal('tagModal'); smoothRefresh(); 
    }

    function exportData() {
        const data = { tags: appTags, tasks: JSON.parse(localStorage.getItem('plannerAppTasks')) || {} };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'schedule-backup.json';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }
    function importData(e) {
        const f = e.target.files[0]; if(!f) return; const r = new FileReader();
        r.onload = function(ev) {
            try {
                const data = JSON.parse(ev.target.result);
                if (data.tasks) localStorage.setItem('plannerAppTasks', JSON.stringify(data.tasks));
                if (data.tags) { localStorage.setItem('plannerAppTags', JSON.stringify(data.tags)); appTags = data.tags; }
                migrateData(); applyDynamicStylesAndUI(); smoothRefresh();
            } catch(err) { alert("Error parsing file."); }
        }; r.readAsText(f);
    }
    function nukeSchedule() { if (confirm("🚨 Clear entire 14-day schedule?")) { localStorage.removeItem('plannerAppTasks'); smoothRefresh(); } }

    document.addEventListener('DOMContentLoaded', () => {
        updateTimeframeIndicator();
        renderGrid();
    });
</script>
</body>
</html>
